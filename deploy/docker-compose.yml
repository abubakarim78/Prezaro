# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: prezaro

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL connection string:
      DATABASE_URL: ${DATABASE_URL:-postgresql://prezaro:prezaro_secret@postgres:5432/prezaro?schema=public}
      # Set a fixed secret (openssl rand -base64 32) so JWTs survive image updates.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # First-run admin
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-abubakarima1969@uds.edu.gh}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-Prezaro Administrator}
      BOOTSTRAP_DEPARTMENT: ${BOOTSTRAP_DEPARTMENT:-General Administration}
      # Email notifications (Resend or SMTP)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Built-in PostgreSQL service for local Docker Compose runs (if not using Coolify's managed DB)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prezaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prezaro_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prezaro}
    volumes:
      - prezaro-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prezaro -d prezaro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional automatic-HTTPS reverse proxy (if not using Cloudflare + Coolify).
  # Enable with:  DOMAIN=attendance.youruniversity.edu docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  prezaro-pgdata:
  caddy-data:
  caddy-config:
